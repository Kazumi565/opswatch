apiVersion: apps/v1
kind: Deployment
metadata:
  name: opswatch-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opswatch-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opswatch-scheduler
    spec:
      serviceAccountName: opswatch
      containers:
        - name: scheduler
          image: opswatch-scheduler:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "opswatch_worker.scheduler"]
          envFrom:
            - configMapRef:
                name: opswatch-config
            - secretRef:
                name: opswatch-secret
          env:
            - name: PYTHONPATH
              value: /worker
            - name: RQ_QUEUE
              value: checks
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
