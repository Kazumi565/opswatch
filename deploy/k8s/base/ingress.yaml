apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opswatch
spec:
  ingressClassName: traefik
  rules:
    - host: opswatch.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: opswatch-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opswatch-frontend
                port:
                  name: http
