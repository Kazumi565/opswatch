apiVersion: v1
kind: Secret
metadata:
  name: opswatch-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: opswatch_local_password
  DATABASE_URL: postgresql+psycopg://opswatch:opswatch_local_password@opswatch-postgres:5432/opswatch
  OPSWATCH_AUTH_SECRET: local_kubernetes_change_me
  OPSWATCH_API_KEY: local-kubernetes-api-key
