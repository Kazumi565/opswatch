apiVersion: apps/v1
kind: Deployment
metadata:
  name: opswatch-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opswatch-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opswatch-redis
    spec:
      serviceAccountName: opswatch
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: opswatch-redis-data
