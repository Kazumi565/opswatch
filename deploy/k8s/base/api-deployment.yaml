apiVersion: apps/v1
kind: Deployment
metadata:
  name: opswatch-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opswatch-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opswatch-api
    spec:
      serviceAccountName: opswatch
      containers:
        - name: api
          image: opswatch-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: opswatch-config
            - secretRef:
                name: opswatch-secret
          env:
            - name: OPSWATCH_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPSWATCH_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPSWATCH_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
