apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opswatch
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: opswatch
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - scheduler-deployment.yaml
  - frontend-deployment.yaml
  - migrate-job.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
  - services.yaml
  - ingress.yaml
