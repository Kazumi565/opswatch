apiVersion: batch/v1
kind: Job
metadata:
  name: opswatch-migrate
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opswatch-migrate
    spec:
      serviceAccountName: opswatch
      restartPolicy: Never
      containers:
        - name: migrate
          image: opswatch-api:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: opswatch-config
            - secretRef:
                name: opswatch-secret
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
