apiVersion: v1
kind: ConfigMap
metadata:
  name: opswatch-config
data:
  OPSWATCH_DEPLOYMENT_MODE: aws-k3s
  OPSWATCH_ORCHESTRATOR: kubernetes
  OPSWATCH_CLOUD_PROVIDER: aws
  OPSWATCH_AUTH_COOKIE_SECURE: "true"
  OPSWATCH_IMAGE_TAG: v0.4.0
  APP_VERSION: v0.4.0
  APP_COMMIT: replace_with_release_commit
  APP_BUILT_AT: replace_with_release_timestamp
